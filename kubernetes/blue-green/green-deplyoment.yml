apiVersion: apps/v1
kind: Deployment

metadata:
  name: devsecops-app-green
  labels:
    app: devsecops-app
    version: green

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devsecops-app
      version: green

  template:
    metadata:
      labels:
        app: devsecops-app
        version: green

    spec:
      containers:
        - name: devsecops-app
          image: ghcr.io/sakib704596/devsecops-platform-app:latest

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10