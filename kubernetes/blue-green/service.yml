apiVersion: v1
kind: Service
metadata:
  name: devsecops-app-bluegreen
spec:
  type: ClusterIP
  selector:
    app: devsecops-app
    # THIS is the actual switch. Right now traffic goes to "blue".
    # Changing this one line to "green" is the entire cutover —
    # instant, not gradual like a rolling update.
    version: blue
  ports:
    - port: 80
      targetPort: 3000
