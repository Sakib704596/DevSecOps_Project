apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  labels:
    app: devsecops-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: how many pods can be DOWN at once during the
      # rollout. 0 means: never drop below the full replica count —
      # a new pod must be ready before an old one is removed. This is
      # the actual setting that guarantees zero dropped capacity.
      maxUnavailable: 0
      # maxSurge: how many EXTRA pods can exist temporarily beyond the
      # normal replica count while rolling out. 1 means Kubernetes can
      # briefly run 3 pods (2 old + 1 new) before removing an old one.
      maxSurge: 1
  selector:
    matchLabels:
      app: devsecops-app
  template:
    metadata:
      labels:
        app: devsecops-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "devsecops-app"
        vault.hashicorp.com/agent-inject-secret-app-credentials: "secret/data/devsecops-app"
        vault.hashicorp.com/agent-inject-template-app-credentials: |
          {{- with secret "secret/data/devsecops-app" -}}
          username={{ .Data.data.username }}
          password={{ .Data.data.password }}
          {{- end -}}
    spec:
      serviceAccountName: default
      containers:
        - name: devsecops-app
          image: ghcr.io/sakib704596/devsecops-platform-app:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devsecops-app-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
