name: CI

# Runs on every push and every pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    # All commands in this job run inside application/, since that's
    # where package.json actually lives
    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
