name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full commit history, not just the latest commit — secrets can hide in old commits too

      # Gitleaks scans the entire repo (and its git history) for patterns
      # that look like real secrets — API keys, private keys, tokens, etc.
      # This runs FIRST, before tests or build, on purpose: if a secret
      # got committed, nothing else should even run until that's dealt with.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: secret-scan

    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  build-and-push:
    name: Build, Scan, and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase the repository owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: false
          load: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only if scan passed)
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:${{ github.sha }}
