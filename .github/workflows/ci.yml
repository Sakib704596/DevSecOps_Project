name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  build-and-push:
    name: Build, Scan, and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase the repository owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # BUILD ONLY — no push yet. We want the image to exist LOCALLY
      # on this runner so Trivy can scan it, before it's allowed
      # anywhere near the registry.
      # ----------------------------------------------------------------
      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: false
          load: true # loads the built image into the local Docker daemon so Trivy can see it
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:${{ github.sha }}

      # ----------------------------------------------------------------
      # THE ACTUAL SECURITY GATE
      # Scans the image we just built. exit-code: '1' means Trivy will
      # make this step FAIL (non-zero exit) if anything matching
      # severity HIGH or CRITICAL is found — which stops the pipeline
      # before the push step ever runs.
      # ----------------------------------------------------------------
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true # don't fail on CVEs with no available fix yet — nothing actionable to do about those right now

      # ----------------------------------------------------------------
      # PUSH — only runs if the Trivy step above didn't fail
      # ----------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only if scan passed)
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/devsecops-platform-app:${{ github.sha }}
