apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-app-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Sakib704596/DevSecOps_Project.git
    targetRevision: main
    path: kubernetes/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-prod

  # Same reasoning as staging — no `automated` sync, manual only,
  # given current cluster capacity constraints (documented in Phase 3 ADR).
  syncOptions:
    - CreateNamespace=true
